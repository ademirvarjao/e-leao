name: Validate Turnstile integration
on:
  push:
    branches-ignore: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: github-pages
    env:
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check public widget configuration
        run: node scripts/check-turnstile-config.mjs
      - run: npm ci
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npm run build
