name: Build and deploy e-Leão
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * *' # 06:17 em Brasília (UTC-3)
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python3 -m unittest discover -s tests -p "test_*.py"
      - run: npm run build
      - name: Atualizar notícias oficiais
        run: python3 scripts/official_updates.py dist/official-updates.json
      - uses: actions/configure-pages@v5
      - name: Make static SPA fallback
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
